<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>getGaid（extApi）</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 16px; line-height: 1.5; }
    h1 { font-size: 1.15rem; margin: 0 0 12px; }
    .hint { color: #666; font-size: 12px; margin-bottom: 12px; }
    #result {
      background: #f0f7ff;
      border: 1px solid #b8d4f0;
      border-radius: 8px;
      padding: 12px 14px;
      min-height: 2em;
      word-break: break-all;
      font-size: 14px;
    }
    .label { font-weight: 600; color: #333; margin-bottom: 6px; }
    button {
      margin-top: 10px;
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>getGaid 返回值</h1>
  <p class="hint">
    需在 App 内已 <code>register(ExtApi)</code> 的 WebView 中打开（如 <code>DetailActivity</code> /h5 详情）。
    调用：<code>callApi('extApi.getGaid', '')</code>。
  </p>
  <div class="label">GAID：</div>
  <div id="result">等待 JsBridge 就绪…</div>
  <button type="button" id="btnRetry">重新获取</button>

  <script>
    (function () {
      'use strict';

      var out = document.getElementById('result');
      var btn = document.getElementById('btnRetry');

      function setText(s) {
        if (s === null || s === undefined) {
          out.textContent = '(无返回值)';
          return;
        }
        if (typeof s === 'object') {
          try {
            out.textContent = JSON.stringify(s, null, 2);
          } catch (e) {
            out.textContent = String(s);
          }
          return;
        }
        out.textContent = String(s);
      }

      function fetchGaid(bridge) {
        if (!bridge || typeof bridge.callApi !== 'function') {
          out.textContent = 'appJsBridge.callApi 不可用';
          return;
        }
        out.textContent = '请求中…';
        // 无参：callApi( 'extApi.getGaid', '' )
        try {
          var ret = bridge.callApi('extApi.getGaid', '');
          if (ret !== null && ret !== undefined && typeof ret === 'object') {
            setText(ret);
            return;
          }
          if (ret === '' || ret === null || ret === undefined) {
            out.textContent =
              '(空) 请确认：1) 本页在已 register(ExtApi) 的 WebView 中 2) Google 广告 ID 可获取';
            return;
          }
          setText(ret);
        } catch (e) {
          out.textContent = '异常: ' + (e && e.message ? e.message : e);
        }
      }

      function whenReady(fn) {
        if (window.appJsBridge && typeof window.appJsBridge.callApi === 'function') {
          fn(window.appJsBridge);
          return;
        }
        document.addEventListener('JsBridgeReady', function onReady() {
          document.removeEventListener('JsBridgeReady', onReady);
          if (window.appJsBridge) fn(window.appJsBridge);
          else setText('JsBridgeReady 后仍无 appJsBridge');
        });
        window.bridgePendingCallbacks = window.bridgePendingCallbacks || [];
        window.bridgePendingCallbacks.push(fn);
      }

      function main() {
        whenReady(function (bridge) {
          setText('正在请求 extApi.getGaid…');
          try {
            fetchGaid(bridge);
          } catch (e) {
            setText('异常: ' + (e && e.message ? e.message : e));
          }
        });
      }

      btn.addEventListener('click', function () {
        whenReady(fetchGaid);
      });

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', main);
      } else {
        main();
      }
    })();
  </script>
</body>
</html>
