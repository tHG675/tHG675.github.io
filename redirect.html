<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快手极速版 3s 定时拉起</title>
    <style>
        body { display: flex; flex-direction: column; align-items: center;
               justify-content: center; height: 100vh; margin: 0;
               font-family: sans-serif; background: #f5f5f5; }
        #countdown { font-size: 72px; font-weight: bold; color: #ff6600; }
        #status { margin-top: 16px; color: #666; font-size: 14px; }
    </style>
</head>
<body>
    <div id="countdown">3</div>
    <div id="status">3 秒后自动拉起快手极速版…</div>

    <script>
        var DEEP_LINK = "intent://home/slideHot?feedInject=H4sIAAAAAAAAAONgFmCQ2LB%2B3u9TrQeeewAAY3pXHQ4AAAA%3D" +
            "&injectTask=3&openFrom=reflux_android_oppo_oppo_csxxlcxhzt_cpc_diy118934" +
            "&type=laxin&inner_cid=730146002" +
            "#Intent;scheme=ksnebula;launchFlags=0x10000000;end";

        var DEEP_LINK_FALLBACK = "ksnebula://home/slideHot?feedInject=H4sIAAAAAAAAAONgFmCQ2LB%2B3u9TrQeeewAAY3pXHQ4AAAA%3D" +
            "&injectTask=3&openFrom=reflux_android_oppo_oppo_csxxlcxhzt_cpc_diy118934" +
            "&type=laxin&inner_cid=730146002";

        var remaining = 1;
        var count = 0;

        function openKwai() {
            count++;
            document.getElementById("status").textContent = "第 " + count + " 次拉起快手极速版…";
            var iframe = document.createElement("iframe");
            iframe.style.display = "none";
            iframe.src = DEEP_LINK;
            document.body.appendChild(iframe);
            var iframe2 = document.createElement("iframe");
            iframe2.style.display = "none";
            iframe2.src = DEEP_LINK_FALLBACK;
            document.body.appendChild(iframe2);
            setTimeout(function() {
                try { document.body.removeChild(iframe); } catch(e) {}
                try { document.body.removeChild(iframe2); } catch(e) {}
            }, 200);
        }

        function startCountdown() {
            remaining = 3;
            document.getElementById("countdown").textContent = remaining;
            var timer = setInterval(function() {
                remaining--;
                document.getElementById("countdown").textContent = remaining;
                if (remaining <= 0) {
                    clearInterval(timer);
                    document.getElementById("countdown").textContent = "GO!";
                    openKwai();
                    setTimeout(startCountdown, 500);
                }
            }, 1000);
        }

        startCountdown();
    </script>
</body>
</html>
